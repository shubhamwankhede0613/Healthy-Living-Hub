<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthy Hub | Evidence-Based Nutrition & Safe Exercise</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Healthy Living Hub is an accessible, evidence-based wellness platform created by Sanskruti Vivek Talmale, Shubham Raju Wankhede, and Samiksha Sandip Taware. Generate personalized nutrition charts, safe exercise plans, and lasting healthy habits.">
  <meta name="keywords" content="nutrition chart, exercise planner, evidence-based nutrition, WHO physical activity guidelines, healthy eating plate, Indian meal plans, meal prep, healthy living hub">
  <meta name="author" content="Sanskruti Vivek Talmale, Shubham Raju Wankhede, Samiksha Sandip Taware">
  <meta property="og:title" content="Healthy Living Hub | Small Daily Choices, Lifelong Health">
  <meta property="og:description" content="Build an evidence-based nutrition chart, discover adaptable exercises that fit your lifestyle, and build practical daily wellness habits.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Outfit (Headings) and Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              deep: '#14532d',
              green: '#166534',
              softGreen: '#dcfce7',
              teal: '#0f766e',
              softTeal: '#ccfbf1',
              amber: '#d97706',
              orange: '#ea580c',
              softOrange: '#ffedd5',
              charcoal: '#1e293b',
              muted: '#475569',
              lightBg: '#f8fafc',
              cardBg: '#ffffff',
              border: '#e2e8f0'
            }
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- External Styles & Data -->
  <link rel="stylesheet" href="styles.css">
  <script src="data.js"></script>

  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-brand-lightBg text-brand-charcoal min-h-screen flex flex-col antialiased selection:bg-brand-softTeal selection:text-brand-teal">
  
  <!-- Root Container for React App -->
  <div id="root">
    <!-- Non-JS Fallback -->
    <noscript>
      <div class="p-8 text-center text-red-600 bg-red-50 max-w-xl mx-auto my-12 rounded-xl border border-red-200">
        <h2 class="text-xl font-bold mb-2">JavaScript Required</h2>
        <p>Healthy Living Hub requires JavaScript to generate personalized nutrition charts and interactive exercise routines. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const DATA = window.HLH_DATA;

    // --- REUSABLE SVG ICONS ---
    const IconHeart = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>;
    const IconApple = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2a4 4 0 00-4 4c0 .3.03.6.1.9C5.8 7.3 4 9.4 4 12c0 4.4 3.6 8 8 8s8-3.6 8-8c0-2.6-1.8-4.7-4.1-5.1.07-.3.1-.6.1-.9a4 4 0 00-4-4z"/></svg>;
    const IconActivity = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const IconCheck = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>;
    const IconAlert = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
    const IconPrint = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>;
    const IconUser = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
    const IconTrash = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);

      // LocalStorage State Management with Sensible Defaults
      const [selectedHabit, setSelectedHabit] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hlh_selected_habit')) || DATA.STARTING_HABITS[0];
        } catch(e) { return DATA.STARTING_HABITS[0]; }
      });

      const [completedHabitsStreak, setCompletedHabitsStreak] = useState(() => {
        try {
          return parseInt(localStorage.getItem('hlh_habit_streak') || '3', 10);
        } catch(e) { return 3; }
      });

      const [aerobicMinutesLogged, setAerobicMinutesLogged] = useState(() => {
        try {
          return parseInt(localStorage.getItem('hlh_aerobic_minutes') || '110', 10);
        } catch(e) { return 110; }
      });

      const [strengthDaysLogged, setStrengthDaysLogged] = useState(() => {
        try {
          return parseInt(localStorage.getItem('hlh_strength_days') || '2', 10);
        } catch(e) { return 2; }
      });

      const [waterGlassesLogged, setWaterGlassesLogged] = useState(() => {
        try {
          return parseInt(localStorage.getItem('hlh_water_glasses') || '7', 10);
        } catch(e) { return 7; }
      });

      const [weeklyUserGoal, setWeeklyUserGoal] = useState(() => {
        return localStorage.getItem('hlh_weekly_goal') || 'Walk 15 minutes after dinner on 4 weekdays';
      });

      const [groceryCheckedItems, setGroceryCheckedItems] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hlh_grocery_checked')) || {};
        } catch(e) { return {}; }
      });

      // Synchronize with LocalStorage
      useEffect(() => {
        localStorage.setItem('hlh_selected_habit', JSON.stringify(selectedHabit));
      }, [selectedHabit]);

      useEffect(() => {
        localStorage.setItem('hlh_habit_streak', completedHabitsStreak.toString());
      }, [completedHabitsStreak]);

      useEffect(() => {
        localStorage.setItem('hlh_aerobic_minutes', aerobicMinutesLogged.toString());
      }, [aerobicMinutesLogged]);

      useEffect(() => {
        localStorage.setItem('hlh_strength_days', strengthDaysLogged.toString());
      }, [strengthDaysLogged]);

      useEffect(() => {
        localStorage.setItem('hlh_water_glasses', waterGlassesLogged.toString());
      }, [waterGlassesLogged]);

      useEffect(() => {
        localStorage.setItem('hlh_weekly_goal', weeklyUserGoal);
      }, [weeklyUserGoal]);

      useEffect(() => {
        localStorage.setItem('hlh_grocery_checked', JSON.stringify(groceryCheckedItems));
      }, [groceryCheckedItems]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const handleResetAllData = () => {
        localStorage.clear();
        setCompletedHabitsStreak(0);
        setAerobicMinutesLogged(0);
        setStrengthDaysLogged(0);
        setWaterGlassesLogged(0);
        setWeeklyUserGoal('');
        setGroceryCheckedItems({});
        setConfirmResetOpen(false);
        showToast('All locally saved wellness data has been permanently cleared.');
      };

      const toggleGroceryItem = (itemKey) => {
        setGroceryCheckedItems(prev => ({
          ...prev,
          [itemKey]: !prev[itemKey]
        }));
      };

      const navItems = [
        { id: 'home', label: 'Home' },
        { id: 'nutrition', label: 'Nutrition Chart' },
        { id: 'exercise', label: 'Exercise Planner' },
        { id: 'tips', label: 'Health Tips' },
        { id: 'progress', label: 'My Progress' },
        { id: 'creators', label: 'About Creators' },
        { id: 'references', label: 'Evidence & References' },
        { id: 'contact', label: 'Contact' }
      ];

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* TOP EMERGENCY & MEDICAL DISCLAIMER BANNER (Visible on all pages) */}
          <div className="bg-emerald-900 text-emerald-50 px-4 py-2.5 text-xs sm:text-sm font-medium border-b border-emerald-800 no-print">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2 text-center md:text-left">
              <div className="flex items-center gap-2">
                <span className="bg-emerald-700 text-white font-bold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">Educational Tool</span>
                <span>{DATA.DISCLAIMERS.standard}</span>
              </div>
              <div className="flex items-center gap-1.5 text-amber-300 font-semibold text-xs shrink-0">
                <IconAlert />
                <span>Emergency: Chest pain, severe breathlessness or injury? Call local emergency services immediately.</span>
              </div>
            </div>
          </div>

          {/* STICKY ACCESSIBLE NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-200 no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Brand Logo & Creators Tagline */}
                <button 
                  onClick={() => { setActiveTab('home'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                  className="flex items-center gap-3 text-left group focus:outline-none focus:ring-2 focus:ring-brand-teal rounded-lg p-1"
                  aria-label="Healthy Living Hub Home"
                >
                  <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-brand-deep to-brand-teal flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v-6h-2v6zm0-8h2V7h-2v2z"/>
                    </svg>
                  </div>
                  <div>
                    <span className="text-xl sm:text-2xl font-bold tracking-tight text-brand-charcoal font-heading block group-hover:text-brand-green transition-colors">
                      Healthy  <span className="text-brand-green"> Hub </span>
                    </span>
                    <span className="text-[11px] text-slate-500 block font-medium">
                      Evidence-Based Nutrition & Movement
                    </span>
                  </div>
                </button>

                {/* Desktop Navigation Links */}
                <nav className="hidden lg:flex items-center gap-1" aria-label="Main Navigation">
                  {navItems.map(item => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => {
                          setActiveTab(item.id);
                          window.scrollTo({ top: 0, behavior: 'smooth' });
                        }}
                        className={`px-3 py-2 text-sm font-semibold rounded-lg transition-all ${
                          isActive
                            ? 'bg-brand-softGreen text-brand-green shadow-xs'
                            : 'text-slate-600 hover:text-brand-green hover:bg-slate-50'
                        }`}
                        aria-current={isActive ? 'page' : undefined}
                      >
                        {item.label}
                      </button>
                    );
                  })}
                </nav>

                {/* Right Action: Quick Print Button on printable tabs */}
                <div className="hidden sm:flex items-center gap-3">
                  {(activeTab === 'nutrition' || activeTab === 'exercise' || activeTab === 'tips') && (
                    <button
                      onClick={() => window.print()}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 text-slate-700 bg-white hover:bg-slate-50 hover:border-slate-400 transition shadow-xs"
                      title="Print or Save as PDF"
                    >
                      <IconPrint />
                      <span>Print / PDF</span>
                    </button>
                  )}
                  <button
                    onClick={() => { setActiveTab('nutrition'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                    className="inline-flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg text-white bg-brand-green hover:bg-brand-deep transition shadow-sm"
                  >
                    Generate Plan
                  </button>
                </div>

                {/* Mobile Menu Button */}
                <div className="flex lg:hidden items-center gap-2">
                  <button
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-teal"
                    aria-label="Toggle Mobile Navigation"
                    aria-expanded={mobileMenuOpen}
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      {mobileMenuOpen ? (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                      ) : (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/>
                      )}
                    </svg>
                  </button>
                </div>

              </div>
            </div>

            {/* Mobile Dropdown Menu */}
            {mobileMenuOpen && (
              <div className="lg:hidden border-t border-slate-200 bg-white px-4 pt-2 pb-6 space-y-1 shadow-xl">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => {
                      setActiveTab(item.id);
                      setMobileMenuOpen(false);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className={`w-full text-left px-4 py-3 text-base font-semibold rounded-lg ${
                      activeTab === item.id
                        ? 'bg-brand-softGreen text-brand-green'
                        : 'text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
                <div className="pt-3 border-t border-slate-100 flex gap-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 text-center text-sm font-semibold rounded-lg border border-slate-300 text-slate-700"
                  >
                    Print Current Page
                  </button>
                  <button
                    onClick={() => { setActiveTab('nutrition'); setMobileMenuOpen(false); }}
                    className="flex-1 py-2.5 text-center text-sm font-bold rounded-lg text-white bg-brand-green"
                  >
                    Start Plan
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* MAIN APPLICATION CONTENT TABS */}
          <main className="flex-grow">
            {activeTab === 'home' && (
              <HomeTab 
                setActiveTab={setActiveTab} 
                selectedHabit={selectedHabit} 
                setSelectedHabit={setSelectedHabit}
                completedHabitsStreak={completedHabitsStreak}
                setCompletedHabitsStreak={setCompletedHabitsStreak}
                showToast={showToast}
              />
            )}

            {activeTab === 'nutrition' && (
              <NutritionTab 
                groceryCheckedItems={groceryCheckedItems}
                toggleGroceryItem={toggleGroceryItem}
                showToast={showToast}
              />
            )}

            {activeTab === 'exercise' && (
              <ExerciseTab 
                aerobicMinutesLogged={aerobicMinutesLogged}
                setAerobicMinutesLogged={setAerobicMinutesLogged}
                strengthDaysLogged={strengthDaysLogged}
                setStrengthDaysLogged={setStrengthDaysLogged}
                showToast={showToast}
              />
            )}

            {activeTab === 'tips' && (
              <HealthTipsTab showToast={showToast} />
            )}

            {activeTab === 'progress' && (
              <ProgressTab 
                aerobicMinutesLogged={aerobicMinutesLogged}
                setAerobicMinutesLogged={setAerobicMinutesLogged}
                strengthDaysLogged={strengthDaysLogged}
                setStrengthDaysLogged={setStrengthDaysLogged}
                waterGlassesLogged={waterGlassesLogged}
                setWaterGlassesLogged={setWaterGlassesLogged}
                weeklyUserGoal={weeklyUserGoal}
                setWeeklyUserGoal={setWeeklyUserGoal}
                completedHabitsStreak={completedHabitsStreak}
                setCompletedHabitsStreak={setCompletedHabitsStreak}
                selectedHabit={selectedHabit}
                setConfirmResetOpen={setConfirmResetOpen}
                showToast={showToast}
              />
            )}

            {activeTab === 'creators' && (
              <AboutCreatorsTab />
            )}

            {activeTab === 'references' && (
              <ReferencesTab />
            )}

            {activeTab === 'contact' && (
              <ContactTab showToast={showToast} />
            )}
          </main>

          {/* TOAST NOTIFICATION CONTAINER */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-brand-charcoal text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <span className="text-emerald-400"><IconCheck /></span>
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* RESET DATA MODAL DIALOG */}
          {confirmResetOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4">
                  <IconTrash />
                </div>
                <h3 className="text-xl font-bold text-slate-900 mb-2 font-heading">Clear Saved Wellness Data?</h3>
                <p className="text-sm text-slate-600 mb-6">
                  This will remove all your locally saved habits, progress minutes, custom goals, and grocery checklists from your browser's localStorage. You will start with a fresh slate.
                </p>
                <div className="flex items-center justify-end gap-3">
                  <button
                    onClick={() => setConfirmResetOpen(false)}
                    className="px-4 py-2 text-sm font-semibold rounded-lg text-slate-700 hover:bg-slate-100"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleResetAllData}
                    className="px-4 py-2 text-sm font-bold rounded-lg text-white bg-red-600 hover:bg-red-700"
                  >
                    Yes, Clear My Data
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ACCESSIBLE SITE FOOTER */}
          <footer className="bg-slate-900 text-slate-300 pt-16 pb-12 border-t border-slate-800 no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-10 mb-12">
                
                {/* Brand Column */}
                <div className="md:col-span-1 space-y-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-brand-green flex items-center justify-center text-white font-bold">
                      H
                    </div>
                    <span className="text-xl font-bold font-heading text-white">Healthy Living Hub</span>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Evidence-based nutrition education and safe, adaptable exercise routines. Committed to body-respectful, sustainable wellness for everyone.
                  </p>
                  <div className="pt-2">
                    <span className="inline-flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-800">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      100% Private (No Account / No Server Storage)
                    </span>
                  </div>
                </div>

                {/* Creators Column */}
                <div>
                  <h4 className="text-sm font-bold uppercase tracking-wider text-white mb-4 font-heading">
                    Created By
                  </h4>
                  <ul className="space-y-2 text-xs text-slate-300">
                    <li className="font-semibold text-emerald-300">Sanskruti Vivek Talmale</li>
                    <li className="text-slate-400">Research Lead & Nutrition Strategy</li>
                    <li className="font-semibold text-teal-300 pt-1">Shubham Raju Wankhede</li>
                    <li className="text-slate-400">Lead Full-Stack Architect & UX Designer</li>
                    <li className="font-semibold text-amber-300 pt-1">Samiksha Sandip Taware</li>
                    <li className="text-slate-400">Exercise Physiology & Wellness Educator</li>
                  </ul>
                </div>

                {/* Quick Navigation Links */}
                <div>
                  <h4 className="text-sm font-bold uppercase tracking-wider text-white mb-4 font-heading">
                    Explore Hub
                  </h4>
                  <ul className="space-y-2 text-xs">
                    {navItems.map(item => (
                      <li key={item.id}>
                        <button
                          onClick={() => { setActiveTab(item.id); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                          className="hover:text-emerald-400 transition-colors text-left"
                        >
                          {item.label}
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* Data Privacy & Reset Action */}
                <div>
                  <h4 className="text-sm font-bold uppercase tracking-wider text-white mb-4 font-heading">
                    Privacy & Storage
                  </h4>
                  <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                    Your personal health metrics and checklists are stored purely on your current device using browser localStorage. We never sell, log, or transmit personal data.
                  </p>
                  <button
                    onClick={() => setConfirmResetOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-red-400 hover:bg-slate-700 hover:text-red-300 border border-slate-700 transition"
                  >
                    <IconTrash />
                    <span>Reset / Delete All Saved Data</span>
                  </button>
                </div>

              </div>

              {/* Bottom Copyright & Universal Mandatory Disclaimer */}
              <div className="pt-8 border-t border-slate-800 text-center space-y-3">
                <p className="text-xs text-slate-400 max-w-4xl mx-auto leading-relaxed">
                  <strong className="text-slate-300">Medical Disclaimer:</strong> {DATA.DISCLAIMERS.standard} Always consult your doctor before beginning any vigorous exercise regimen or therapeutic dietary protocol.
                </p>
                <p className="text-[11px] text-slate-500">

    function NutritionTab({ groceryCheckedItems, toggleGroceryItem, showToast }) {
      const [viewMode, setViewMode] = useState('cards'); // 'cards' | 'table'
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        units: 'metric', // metric (cm, kg) or imperial (ft/in, lbs)
        age: 28,
        sex: 'female',
        heightCm: 165,
        heightFt: 5,
        heightIn: 5,
        weightKg: 62,
        weightLbs: 136,
        isPregnantOrBreastfeeding: false,
        conditions: [],
        activityLevel: 'moderately_active',
        primaryGoal: 'general_health',
        dietaryPattern: 'vegetarian',
        cuisine: 'indian',
        budget: 'medium',
        cookingTime: '30_60',
        allergies: [],
        dislikedFoods: '',
        mealsCount: '3_plus_snacks',
        typicalMealTimes: 'Breakfast 8:30 AM, Lunch 1:30 PM, Snack 5:00 PM, Dinner 8:30 PM',
        waterHabitLiters: '2.5',
        wantGroceryAndPrepTips: true
      });

      const [hasGeneratedPlan, setHasGeneratedPlan] = useState(true);

      const handleConditionToggle = (cond) => {
        setFormData(prev => {
          const exists = prev.conditions.includes(cond);
          return {
            ...prev,
            conditions: exists ? prev.conditions.filter(c => c !== cond) : [...prev.conditions, cond]
          };
        });
      };

      const handleAllergyToggle = (allergy) => {
        setFormData(prev => {
          const exists = prev.allergies.includes(allergy);
          return {
            ...prev,
            allergies: exists ? prev.allergies.filter(a => a !== allergy) : [...prev.allergies, allergy]
          };
        });
      };

      // BMI & Caloric Calculation Engine
      const calculations = useMemo(() => {
        let heightMeters = 1.65;
        let weightKg = 62;

        if (formData.units === 'metric') {
          heightMeters = (formData.heightCm || 165) / 100;
          weightKg = formData.weightKg || 62;
        } else {
          const totalInches = (parseInt(formData.heightFt || 5, 10) * 12) + parseInt(formData.heightIn || 5, 10);
          heightMeters = totalInches * 0.0254;
          weightKg = (formData.weightLbs || 136) * 0.453592;
        }

        const bmi = (weightKg / (heightMeters * heightMeters)).toFixed(1);
        
        let bmiCategory = 'Healthy Weight Range';
        if (bmi < 18.5) bmiCategory = 'Underweight screening range';
        else if (bmi < 25) bmiCategory = 'Standard weight range';
        else if (bmi < 30) bmiCategory = 'Overweight screening range';
        else bmiCategory = 'Higher weight screening range';

        // Mifflin - St Jeor Equation for BMR
        const age = parseInt(formData.age || 28, 10);
        let bmr = (10 * weightKg) + (6.25 * heightMeters * 100) - (5 * age);
        bmr = formData.sex === 'male' ? bmr + 5 : bmr - 161;

        // Physical Activity Level (PAL) Multiplier
        let pal = 1.55;
        if (formData.activityLevel === 'sedentary') pal = 1.2;
        else if (formData.activityLevel === 'lightly_active') pal = 1.375;
        else if (formData.activityLevel === 'moderately_active') pal = 1.55;
        else if (formData.activityLevel === 'very_active') pal = 1.725;
        else if (formData.activityLevel === 'athlete') pal = 1.9;

        let tdee = Math.round(bmr * pal);

        // Adjust for non-extreme, sustainable goals
        let targetCalories = tdee;
        if (formData.primaryGoal === 'gradual_weight_loss') targetCalories = Math.max(1300, tdee - 350);
        else if (formData.primaryGoal === 'gradual_weight_gain') targetCalories = tdee + 350;
        else if (formData.primaryGoal === 'muscle_support') targetCalories = tdee + 200;

        // Macronutrient Distribution
        const proteinGrams = Math.round((targetCalories * 0.22) / 4);
        const carbsGrams = Math.round((targetCalories * 0.50) / 4);
        const fatGrams = Math.round((targetCalories * 0.28) / 9);
        const fiberTargetGrams = weightKg > 70 ? 35 : 28;
        const waterTargetLiters = (weightKg * 0.035).toFixed(1);

        return {
          bmi,
          bmiCategory,
          calorieRange: `${targetCalories - 100} – ${targetCalories + 100}`,
          targetCalories,
          proteinGrams,
          carbsGrams,
          fatGrams,
          fiberTargetGrams,
          waterTargetLiters
        };
      }, [formData]);

      // Check if user has high-risk conditions
      const hasMedicalFlag = formData.isPregnantOrBreastfeeding || formData.conditions.length > 0 || formData.age < 18 || formData.age > 65;

      // Select plan list based on cuisine preference
      const activeMealPlan = formData.cuisine === 'mediterranean' 
        ? DATA.NUTRITION_PLANS.mediterranean 
        : DATA.NUTRITION_PLANS.indian;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-12">
          
          {/* Header Title */}
          <div className="text-center max-w-3xl mx-auto">
            <span className="text-xs uppercase font-bold tracking-wider text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">
              Evidence-Based Meal Architecture
            </span>
            <h1 className="text-3xl sm:text-5xl font-extrabold text-slate-900 font-heading mt-2">
              Personalized 7-Day Nutrition Chart
            </h1>
            <p className="text-base text-slate-600 mt-2">
              Generate a balanced, culturally adaptive weekly meal blueprint. Grounded in WHO and Dietary Guidelines for Americans principles—without extreme restriction.
            </p>
          </div>

          {/* MEDICAL SAFETY SCREENING ALERT BANNER */}
          {hasMedicalFlag && (
            <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-5 text-amber-900 shadow-sm flex items-start gap-4">
              <span className="text-amber-600 text-2xl shrink-0 mt-0.5"><IconAlert /></span>
              <div className="space-y-1">
                <h3 className="font-bold text-base font-heading">
                  Important Clinical Guidance for Your Profile
                </h3>
                <p className="text-xs sm:text-sm text-amber-800 leading-relaxed">
                  You indicated that you are {formData.isPregnantOrBreastfeeding ? 'pregnant/breastfeeding, ' : ''}
                  {formData.age < 18 ? 'under 18, ' : ''}{formData.age > 65 ? 'over 65, ' : ''}
                  {formData.conditions.length > 0 ? `managing ${formData.conditions.join(', ')}. ` : ''}
                  Because medical conditions require individualized therapeutic nutrition and careful clinical monitoring, this educational chart serves as a general informational reference. Please review this plan with your treating doctor or registered dietitian before making significant nutritional modifications.
                </p>
              </div>
            </div>
          )}

          {/* MULTI-STEP INTERACTIVE QUESTIONNAIRE FORM */}
          <div className="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200 shadow-sm no-print">
            <div className="border-b border-slate-200 pb-5 mb-8 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 className="text-xl sm:text-2xl font-bold text-slate-900 font-heading">
                  Step {step} of 4: {
                    step === 1 ? 'Body Metrics & Units' :
                    step === 2 ? 'Health Screening & Safety' :
                    step === 3 ? 'Lifestyle, Cuisine & Budget' :
                    'Allergies, Timing & Meal Structure'
                  }
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  All metrics stay on your computer. Nothing is sent to an external server.

              {/* Progress Indicator Dots */}

                {[1, 2, 3, 4].map(s => (

                    key={s}

                    }`}

                    {s}

            {/* STEP 1: Body Metrics */}
            {step === 1 && (

          {/* Header */}
          <div className="text-center max-w-3xl mx-auto">
            <span className="text-xs uppercase font-bold tracking-wider text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">
              Leadership & Scientific Vision
            </span>
            <h1 className="text-3xl sm:text-5xl font-extrabold text-slate-900 font-heading mt-2">
              Meet the Creators
            </h1>
            <p className="text-base text-slate-600 mt-2">
              Healthy Living Hub was envisioned and engineered by three passionate wellness researchers and technologists dedicated to democratizing reliable, evidence-based lifestyle tools.
            </p>
          </div>

          {/* Creators Grid */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            {creators.map((c, idx) => (
              <div key={idx} className="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm flex flex-col justify-between space-y-6 hlh-card">
                <div className="space-y-4">
                  
                  {/* Avatar Placeholder with Initials */}
                  <div className={`w-20 h-20 rounded-2xl bg-gradient-to-br ${c.avatarColor} text-white font-extrabold text-2xl flex items-center justify-center shadow-lg font-heading`}>
                    {c.initials}
                  </div>

                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-brand-green bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
                      {c.badge}
                    </span>
                    <h3 className="text-xl font-bold text-slate-900 font-heading mt-2">
                      {c.name}
                    </h3>
                    <div className="text-xs font-semibold text-slate-500">
                      {c.role}
                    </div>
                  </div>

                  <p className="text-xs text-slate-600 leading-relaxed">
                    {c.bio}
                  </p>
                </div>

                <div className="pt-4 border-t border-slate-100 text-[11px] text-slate-400 font-medium">
                  Healthy Living Hub Core Team
                </div>
              </div>
            ))}
          </div>

          {/* SHARED VISION STATEMENT CARD */}
          <div className="bg-gradient-to-br from-emerald-900 via-green-900 to-teal-900 text-white rounded-3xl p-8 sm:p-12 shadow-xl text-center max-w-4xl mx-auto space-y-4">
            <span className="text-xs font-bold uppercase tracking-wider text-emerald-300 bg-white/10 px-3 py-1 rounded-full border border-white/20">
              Our Guiding Purpose
            </span>
            <h3 className="text-xl sm:text-3xl font-extrabold font-heading leading-snug">
              "{DATA.SHARED_VISION}"
            </h3>
            <p className="text-xs text-emerald-100 max-w-xl mx-auto leading-relaxed">
              We believe that health information should be completely transparent, respectful of individual bodily autonomy, culturally adaptable, and freely accessible to everyone without paywalls or restrictive dogma.
            </p>
          </div>

        </div>
      );
    }

    // ==========================================
    // 7. EVIDENCE & REFERENCES COMPONENT
    // ==========================================
    function ReferencesTab() {
      const refs = DATA.REFERENCES;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-12">
          
          {/* Header */}
          <div className="text-center max-w-3xl mx-auto">
            <span className="text-xs uppercase font-bold tracking-wider text-teal-800 bg-teal-100 px-3 py-1 rounded-full">
              Authoritative Scientific Foundations
            </span>
            <h1 className="text-3xl sm:text-5xl font-extrabold text-slate-900 font-heading mt-2">
              Evidence & References
            </h1>
            <p className="text-base text-slate-600 mt-2">
              Healthy Living Hub synthesizes peer-reviewed guidelines from leading international public health institutions. Below are our foundational references:
            </p>
          </div>

          {/* Core Guidelines List */}
          <div className="space-y-6">
            {refs.map((ref, idx) => (
              <div key={idx} className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 border-b border-slate-100 pb-3">
                  <h3 className="text-lg sm:text-xl font-bold text-slate-900 font-heading">
                    {ref.title}
                  </h3>
                  <span className="text-xs font-semibold text-brand-green">
                    {ref.organization}
                  </span>
                </div>

                <p className="text-xs text-slate-600 leading-relaxed">
                  {ref.summary}
                </p>

                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <span className="text-slate-700">
                    <strong>Core Takeaway:</strong> {ref.keyPoint}
                  </span>
                  <a
                    href={ref.link}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="font-bold text-brand-teal hover:underline shrink-0"
                  >
                    View Official Publication ↗
                  </a>
                </div>
              </div>
            ))}
          </div>

          {/* Population Guidance Adaptation Note */}
          <div className="p-6 rounded-2xl bg-amber-50 border border-amber-200 text-amber-950 text-xs leading-relaxed space-y-2">
            <h4 className="font-bold text-sm text-amber-900">
              Adapting Population Guidance to Individual Lives
            </h4>
            <p>
              National and international nutritional guidelines are formulated for population-level public health targets. Real humans have unique metabolic rates, cultural food traditions, budgets, work schedules, and medical histories. Healthy Living Hub encourages you to treat these guidelines as a flexible framework, adapting them in partnership with your registered dietitian or primary physician.
            </p>
          </div>

        </div>
      );
    }

    // ==========================================
    // 8. CONTACT COMPONENT
    // ==========================================
    function ContactTab({ showToast }) {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        topic: 'nutrition_feedback',
        message: ''
      });
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.message) {
          alert('Please fill out all fields before submitting.');
          return;
        }

        // Save inquiry in localStorage for simulation
        try {
          const inquiries = JSON.parse(localStorage.getItem('hlh_inquiries') || '[]');
          inquiries.push({ ...formData, timestamp: new Date().toISOString() });
          localStorage.setItem('hlh_inquiries', JSON.stringify(inquiries));
        } catch(err) {}

        setSubmitted(true);
        showToast('Thank you! Your feedback has been recorded.');
      };

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-8">
          
          <div className="text-center">
            <span className="text-xs uppercase font-bold tracking-wider text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">
              Get in Touch
            </span>
            <h1 className="text-3xl sm:text-5xl font-extrabold text-slate-900 font-heading mt-2">
              Contact the Creation Team
            </h1>
            <p className="text-base text-slate-600 mt-2">
              We welcome suggestions, bug reports, and academic inquiries from our community.
            </p>
          </div>

          {/* CRITICAL NON-MEDICAL NOTICE */}
          <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-5 text-amber-900 flex items-start gap-3 shadow-xs">
            <span className="text-amber-600 text-xl shrink-0 mt-0.5"><IconAlert /></span>
            <p className="text-xs leading-relaxed">
              <strong>Medical Disclaimer:</strong> The Healthy Living Hub creation team provides educational wellness tools and is strictly unable to provide personal medical diagnoses, clinical prescription diets, or individualized treatment plans. For medical concerns, please consult a licensed healthcare professional.
            </p>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200 shadow-sm">
            {submitted ? (
              <div className="text-center py-8 space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-3xl">
                  ✓
                </div>
                <h3 className="text-2xl font-bold text-slate-900 font-heading">
                  Message Successfully Received
                </h3>
                <p className="text-sm text-slate-600 max-w-md mx-auto leading-relaxed">
                  Thank you for reaching out, <strong>{formData.name}</strong>. Sanskruti, Shubham, and Samiksha appreciate your input and will review your note.
                </p>
                <button
                  onClick={() => {
                    setSubmitted(false);
                    setFormData({ name: '', email: '', topic: 'nutrition_feedback', message: '' });
                  }}
                  className="px-6 py-2.5 rounded-xl font-bold text-xs bg-brand-green text-white hover:bg-brand-deep transition"
                >
                  Send Another Note
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Your Full Name</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({...formData, name: e.target.value})}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20"
                      placeholder="e.g. Aditi Sharma"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Your Email Address</label>
                    <input
                      type="email"
                      required
                      value={formData.email}
                      onChange={(e) => setFormData({...formData, email: e.target.value})}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20"
                      placeholder="aditi@example.com"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Topic of Inquiry</label>
                  <select
                    value={formData.topic}
                    onChange={(e) => setFormData({...formData, topic: e.target.value})}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20"
                  >
                    <option value="nutrition_feedback">Nutrition Chart Feedback or Recipe Suggestion</option>
                    <option value="exercise_feedback">Exercise Planner Suggestion or Accessibility Feedback</option>
                    <option value="bug_report">Website Bug Report / Technical Feedback</option>
                    <option value="general_inquiry">General Inquiry / Educational Collaboration</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Your Message</label>
                  <textarea
                    rows="5"
                    required
                    value={formData.message}
                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20"
                    placeholder="Share your thoughts, questions, or ideas with the team..."
                  ></textarea>
                </div>

                <div className="pt-2 text-right">
                  <button
                    type="submit"
                    className="px-8 py-3 rounded-xl font-bold text-sm bg-brand-green text-white hover:bg-brand-deep transition shadow-md"
                  >
                    Send Message
                  </button>
                </div>
              </form>
            )}
          </div>

        </div>
      );
    }

    // Mount React App to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
